<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked In 50 · built by Carter</title>
<link rel="icon" id="fav">
<meta name="theme-color" content="#0E0F0C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Locked In 50">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F0C; --card:#17191A; --card2:#1E2122; --line:#2A2E30;
  --text:#F2F3EE; --mute:#8D9391; --acc:#C8F542; --ink:#0E0F0C; --hot:#FF7A45;
  --r:16px;
  --hostbar:52px; /* room for the hosting badge at the bottom of the screen; set to 0px to remove */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:460px;margin:0 auto;min-height:100dvh;padding:20px 18px calc(110px + var(--hostbar))}
.mute{color:var(--mute)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
h2{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:26px;line-height:1.1;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.center{text-align:center}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
.btn.primary{background:var(--acc);color:var(--ink)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{margin-top:0}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
.input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--acc)}
.err{color:var(--hot);font-size:14px;margin:-4px 0 12px}

/* welcome */
.welcome{display:flex;flex-direction:column;min-height:calc(100dvh - 130px);justify-content:center}
.logo{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:64px;line-height:.9;letter-spacing:-.03em}
.logo span{display:block;font-size:150px;color:var(--acc);letter-spacing:-.06em}
.tag{font-size:19px;line-height:1.4;margin:22px 0 26px;color:#D7DAD3}
.rules{display:grid;gap:10px;margin-bottom:30px}
.rule{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:#C9CCC6}
.rule b{flex:0 0 26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc)}
.lockup{display:flex;align-items:center;gap:18px}
.lname{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:44px;line-height:.92;letter-spacing:-.02em}
.lname span{display:block;font-size:88px;color:var(--acc);letter-spacing:-.05em}
.built{font-size:12px;font-weight:700;letter-spacing:.42em;color:var(--mute);text-align:center;margin-top:22px}
.avedit{position:relative;cursor:pointer;display:block;flex:0 0 auto}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--ink);display:grid;place-items:center;border:2px solid var(--bg)}
.field .photopick{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;color:var(--text);font-size:15px;margin:0}
.pp{width:56px;height:56px;border-radius:50%;background:var(--card2);border:1px dashed #4A4F51;display:grid;place-items:center;overflow:hidden;color:var(--mute);font-size:24px}
.pp img{width:100%;height:100%;object-fit:cover}
.tlink{font-size:12px;color:var(--mute);text-decoration:underline;padding:0}
.a2hs{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.a2hs b{display:block;font-size:14px}
.a2hs small{font-size:12px;color:var(--mute)}
.mbody{color:#C9CCC6;margin:10px 0 20px;line-height:1.5;font-size:15px}
.mbody ol{padding-left:20px;display:grid;gap:8px;margin-top:8px}
.mbody .tip{font-size:13px;color:var(--mute);margin-top:12px}
.demo-note{text-align:center;font-size:13px;color:var(--mute);margin-top:18px}

/* steps */
.steps{display:flex;gap:6px;margin:4px 0 22px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--acc)}
.sub{color:var(--mute);font-size:15px;line-height:1.45;margin:8px 0 18px}
.ditem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px}
.ditem .lbl{flex:1;font-weight:600;font-size:15px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--ink)}
.x{width:30px;height:30px;border-radius:8px;color:var(--mute);font-size:18px}
.x:hover{background:var(--card2);color:var(--text)}
.addrow{display:flex;gap:8px;margin:12px 0}
.addrow .input{flex:1}
.addrow button{padding:0 18px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{padding:8px 12px;border-radius:999px;border:1px dashed var(--line);font-size:13px;color:#C9CCC6}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.count{font-size:13px;color:var(--mute);margin-bottom:10px}
.count b{color:var(--acc)}
.gcard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard .field{margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:#C9CCC6;margin-top:4px}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
.note{font-size:13px;color:var(--mute);line-height:1.4;margin-top:8px}
.footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 18px calc(18px + var(--hostbar))}
.footer .in{max-width:460px;margin:0 auto}
.opt{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);text-align:center;font-weight:600}
.opt.on{border-color:var(--acc);color:var(--acc);background:rgba(200,245,66,.06)}
.sumlist{list-style:none}
.sumlist li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sumlist li:last-child{border:0}
.member{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;text-align:left;font-weight:600}
.member.on{border-color:var(--acc)}

/* main */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top .crew{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:15px;letter-spacing:.02em}
.top .crew span span{color:var(--acc)}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:center}
.daynum{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:84px;line-height:.9;letter-spacing:-.04em}
.daynum span{font-size:28px;color:var(--mute);letter-spacing:0}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:24px;display:block;line-height:1}
.ring .val small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.track{height:6px;background:var(--line);border-radius:6px;margin:16px 0 12px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.quote{font-size:17px;line-height:1.45;font-weight:500;position:relative;padding:18px 18px 16px}
.quote cite{display:block;font-style:normal;font-size:13px;color:var(--mute);margin-top:8px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;transition:all .15s}
.item .box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #4A4F51;display:grid;place-items:center;transition:all .15s}
.item .lbl{flex:1;font-weight:600;font-size:16px}
.item.on{border-color:rgba(200,245,66,.4);background:rgba(200,245,66,.06)}
.item.on .box{background:var(--acc);border-color:var(--acc)}
.item.on .box::after{content:'';width:7px;height:12px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item.on .lbl{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(200,245,66,.5)}
.pips{display:flex;gap:3px}
.pips i{width:5px;height:14px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--hot)}
.done-banner{margin-top:14px;padding:16px;border-radius:14px;background:var(--acc);color:var(--ink);font-weight:700;text-align:center}
.locked{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}

.lb .lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb .lrow:last-child{border:0}
.lb .rank{width:20px;font-family:'Archivo Black','Arial Black',system-ui,sans-serif;color:var(--mute);font-size:15px}
.lb .lrow.first .rank{color:var(--acc)}
.lb .who{flex:1;min-width:0}
.lb .who b{display:block;font-size:15px}
.lb .who small{font-size:12px;color:var(--mute)}
.lb .sc{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:20px}
.lb .me{color:var(--acc)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gbar{margin:10px 0}
.gbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.compose textarea{width:100%;min-height:70px;resize:vertical;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;outline:none}
.compose textarea:focus{border-color:var(--acc)}
.compose .row{justify-content:flex-end;margin-top:8px}
.sbtn{padding:9px 16px;border-radius:10px;background:var(--acc);color:var(--ink);font-weight:700;font-size:14px}
.post{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.post:last-child{border:0}
.pbody{flex:1;min-width:0}
.phead{display:flex;gap:8px;align-items:baseline;font-size:14px}
.phead span{font-size:12px}
.pbody p{font-size:15px;line-height:1.45;margin-top:3px;word-wrap:break-word}
.pact{display:flex;gap:14px;margin-top:8px;align-items:center;font-size:13px}
.react{padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.react.on{border-color:var(--acc);background:rgba(200,245,66,.1);color:var(--acc)}
.cm{font-size:14px;margin-top:8px;padding-left:10px;border-left:2px solid var(--line);line-height:1.4}
.cbox{display:flex;gap:6px;margin-top:8px}
.cbox input{flex:1;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;min-width:0}
.cbox input:focus{border-color:var(--acc)}
.cbox button{font-size:13px;font-weight:700;color:var(--acc);padding:0 8px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:22px;display:block}
.stat small{font-size:11px;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--card2);position:relative}
.cal i.z{background:#3A2320}
.cal i.l1{background:rgba(200,245,66,.25)}
.cal i.l2{background:rgba(200,245,66,.55)}
.cal i.l3{background:var(--acc)}
.cal i.fut{background:transparent;border:1px dashed var(--line)}
.cal i.today{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.gl{display:flex;gap:8px;margin-top:10px}
.gl .input{padding:10px 12px;font-size:15px}
.gl button{padding:0 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-weight:600}
.badge.on{border-color:rgba(200,245,66,.4);color:var(--acc)}
.big{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:28px}
.linkbtn{font-size:14px;font-weight:600;color:var(--mute);padding:10px 0;display:block;width:100%;text-align:left;border-top:1px solid var(--line)}
.linkbtn:first-of-type{border-top:0}
.linkbtn:hover{color:var(--text)}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,15,12,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav .in{max-width:460px;margin:0 auto;display:flex}
nav button{flex:1;padding:12px 0 calc(16px + var(--hostbar));font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:380px;width:100%}
.mbox p{color:#C9CCC6;margin:10px 0 20px;line-height:1.45}
.mrow{display:flex;gap:10px}
.mrow .btn{margin:0}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--hostbar));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--ink);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- v2 additions ---- */
.streak{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:14px}
.streak .fl{font-size:40px;line-height:1;filter:grayscale(1) opacity(.45);transition:filter .2s}
.streak.lit{border-color:rgba(255,122,69,.55);background:linear-gradient(0deg,rgba(255,122,69,.08),rgba(255,122,69,.08)),var(--card)}
.streak.lit .fl,.streak.risk .fl{filter:none}
.streak.risk .fl{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.streak .num{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:44px;line-height:.9;letter-spacing:-.03em}
.streak .lab{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.streak .sub{font-size:13px;color:var(--mute);margin-top:3px}
.streak .best{margin-left:auto;text-align:right}
.streak .best b{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:22px;display:block}
.streak .best small{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.trk{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.trk:last-child{border:0}
.trk .tl{flex:1;min-width:0}
.trk .tl b{display:block;font-size:15px}
.trk .tl small{font-size:12px;color:var(--mute)}
.trk input{width:96px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;outline:none;text-align:right}
.trk input:focus{border-color:var(--acc)}
.trk button.sm{padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.cchip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:#C9CCC6;white-space:nowrap}
.cchip.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.cchip.add{border-style:dashed;color:var(--mute)}
.crewhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.crewhead h2{font-size:24px}
.rk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border:0}
.rk .rank{width:28px;font-family:'Archivo Black','Arial Black',system-ui,sans-serif;color:var(--mute);font-size:16px}
.rk.top .rank{color:var(--acc)}
.rk .cn{flex:1;min-width:0}
.rk .cn b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .cn small{font-size:12px;color:var(--mute)}
.rk.mine .cn b{color:var(--acc)}
.rk .sc{font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:20px}
.crest{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:'Archivo Black','Arial Black',system-ui,sans-serif;font-size:15px;color:var(--ink)}
.hist{list-style:none;margin-top:10px;border-top:1px solid var(--line)}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li span:first-child{flex:1;color:var(--mute)}
.hist li .pbt{font-size:11px;font-weight:700;color:var(--hot)}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:12px;position:relative}
.bars i{flex:1;background:var(--card2);border-radius:3px 3px 0 0;min-height:2px}
.bars i.v{background:rgba(200,245,66,.55)}
.bars i.hit{background:var(--acc)}
.bars .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--mute)}
.optc{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px}
.optc.on{border-color:var(--acc);background:rgba(200,245,66,.05)}
.optc b{display:block;font-size:15px}
.optc small{font-size:13px;color:var(--mute)}
.optc .input{margin-top:10px}
.invite{border-color:rgba(200,245,66,.4)}
.mbody .input{margin-top:8px}
.danger{color:#FF8A7A !important}
.memrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.memrow span{flex:1;font-weight:600}
nav button{font-size:11px}

.optc button{display:block;width:100%;text-align:left}
.chopt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.chopt input{margin-top:3px;width:18px;height:18px;accent-color:var(--acc);flex:0 0 auto}
.chopt b{display:block;font-size:14px}
.chopt small{font-size:12px;color:var(--mute)}
.chopt:has(input:checked){border-color:var(--acc);background:rgba(200,245,66,.05)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =========================================================

const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };

function ago(ts){ const s = (Date.now()-ts)/1000; if (s<60) return 'now'; if (s<3600) return Math.floor(s/60)+'m'; if (s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; }
// "24:38" → 1478 seconds; "1:02:10" → 3730; a bare "25" is read as minutes.
function parseTime(str){
  str = String(str || '').trim(); if (!str) return NaN;
  if (/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str) * 60);
  const p = str.split(':').map(x => x.trim());
  if (p.some(x => !/^\d+(\.\d+)?$/.test(x)) || p.length > 3) return NaN;
  return Math.round(p.reduce((a, x) => a*60 + parseFloat(x), 0));
}
function fmtTime(sec){ sec = Math.round(+sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; }

/* ---------- scoring (works on any person: {startDate, items, days}) ---------- */
function score(u,d){
  const tot = u.items.reduce((a,i)=>a+i.weight,0), done = u.days[d] || [];
  const got = u.items.filter(i=>done.includes(i.id)).reduce((a,i)=>a+i.weight,0);
  return tot ? Math.round(got/tot*100) : 0;
}
const dayNum = u => diff(u.startDate, today()) + 1;
function counted(u){
  const t = today(), out = [], n = Math.min(dayNum(u), LEN);
  for (let i=0;i<n;i++){ const d = addDays(u.startDate,i); if (d < t || (u.days[d] && u.days[d].length)) out.push(d); }
  return out;
}
function avg(u,last){ let ds = counted(u); if (last) ds = ds.filter(d => d > addDays(today(), -last)); return ds.length ? Math.round(ds.reduce((a,d)=>a+score(u,d),0)/ds.length) : 0; }
function streak(u){ const t = today(); let d = score(u,t)===100 ? t : addDays(t,-1), n = 0;
  while (d >= u.startDate && diff(u.startDate,d) < LEN && score(u,d) === 100){ n++; d = addDays(d,-1); } return n; }
function bestStreak(u){ let b=0,c=0; const n = Math.min(dayNum(u),LEN);
  for (let i=0;i<n;i++){ if (score(u,addDays(u.startDate,i))===100){ c++; b=Math.max(b,c); } else c=0; } return b; }
const fullDays = u => counted(u).filter(d => score(u,d)===100).length;
const cur = g => g.logs.length ? g.logs[g.logs.length-1].value : g.start;
function pct(g){ if (g.pct != null) return g.pct; const span = g.target-g.start; return span ? Math.round((cur(g)-g.start)/span*100) : 100; }
const lowerBetter = g => g.target < g.start;
function bestOf(g){ const v = g.logs.map(l=>l.value); if (!v.length) return null; return lowerBetter(g) ? Math.min(...v) : Math.max(...v); }
const clamp = v => Math.max(0, Math.min(100, v));

function spark(g, sd){
  const vals = [g.start, ...g.logs.filter(l => !(l.date === sd && l.value === g.start)).map(l=>l.value)]; if (vals.length < 2) return '';
  const W=300,H=64,P=6, all=[...vals,g.target], mn=Math.min(...all), mx=Math.max(...all), rg=(mx-mn)||1;

    <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4" fill="#C8F542"/></svg>`;
}

const $app = document.getElementById('app');

  else $app.innerHTML = ({welcome:vWelcome, account:vAccount, list:vList, goals:vGoals, trackers:vTrackers, crew:vCrewStep, lock:vLock, login:vLogin}[ui.view] || vWelcome)();
}
const val = id => (document.getElementById(id)?.value || '').trim();
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(()=>el.classList.remove('show'), 2400); }
function modal(title, body, ok, fn, solo){
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="mbox"><h3 style="font-size:19px">${title}</h3><div class="mbody">${body}</div><div class="mrow">${solo?'':'<button class="btn ghost" data-m="x">Cancel</button>'}<button class="btn primary" data-m="ok">${ok}</button></div></div>`;
  m.classList.add('show');
  const inp = m.querySelector('input'); if (inp) setTimeout(()=>inp.focus(), 50);
  const close = () => m.classList.remove('show');
  const go = async () => { const r = await fn(m); if (r !== false) close(); };
  m.onclick = e => { const k = e.target.dataset.m; if (k==='ok') go(); else if (k==='x' || e.target===m) close(); };
  m.onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go(); } };
}

/* ---------- actions ---------- */
async function act(a, v, el){
  const d = ui.draft;
  const busy = (t) => { if (el){ el.disabled = true; if (t) el.textContent = t; } };
  switch(a){
    case 'go': if (v === 'cancel-fresh') { ui.draft = null; ui.err = ''; break; } ui.view = v; ui.err = ''; if (v==='welcome') ui.joinPhoto = null; break;
    /* --- onboarding --- */
    case 'account': {
      const name = val('j-name'), pin = val('j-pin');
      ui.jf.name = name;
      if (!/^[A-Za-z0-9_.]{3,20}$/.test(name)) { ui.err = ERR.bad_username; break; }
      if (!/^\d{6}$/.test(pin)) { ui.err = 'PIN needs to be 6 digits.'; break; }
      busy('Checking…');
      try {
        const r = await rpc('check_username', { p_username: name });
        if (!r.available) { ui.err = ERR.username_taken; break; }
        const pj = ui.pendingJoin;
        ui.err = ''; ui.draft = { username:name, pin, photo: ui.joinPhoto || null, items:[], goals:[], trackers:[], startDate: today(),
          crewMode: pj ? 'join' : 'start', joinCode: pj ? pj.code : '', joinName: pj ? pj.name : '', joinKickoff: pj ? pj.kickoff : null, crewName:'' };
        ui.view = 'list';
      } catch(e){ ui.err = errMsg(e); }
      break;
    }
    case 'sugg': if (d.items.length < MAX_ITEMS) d.items.push({label:v, weight:2}); break;
    case 'add-item': {
      const l = val('add-item'); if (!l) return;
      if (d.items.length >= MAX_ITEMS) { toast(`Max ${MAX_ITEMS} items`); return; }
      if (d.items.some(i=>i.label.toLowerCase()===l.toLowerCase())) { toast('Already on your list'); return; }
      d.items.push({label:l, weight:2}); render(); document.getElementById('add-item')?.focus(); return;
    }
    case 'w': d.items[+el.dataset.i].weight = +v; break;
    case 'rm-item': d.items.splice(+v,1); break;
    case 'to-goals': ui.err = ''; ui.view = 'goals'; break;
    case 'goal-t': if (d.goals.length < MAX_GOALS) d.goals.push({...GOAL_TEMPLATES[v], start:'', target:''}); break;
    case 'gkind': d.goals[+el.dataset.i].kind = v; break;
    case 'rm-goal': d.goals.splice(+v,1); ui.err=''; break;
    case 'cancel-fresh': ui.draft = null; ui.err = ''; break;
    case 'new-ch': startFresh(null); return;
    case 'switch-ch': ui.chId = v; ls.set(CHKEY, v); break;
    case 'change-ch': {
      const my = ME.crews.find(c=>c.id===CREW.id); const crew = CREW;
      modal(`Fresh 50 days for ${esc(crew.name)}`, copyPicker(my.challengeId), 'Next', async (m) => {
        const pv = pickVal(m); if (!pv) return false;
        setTimeout(() => startFresh({ type:'for', crewId: crew.id, name: crew.name, kickoff: crew.kickoff }, pv === 'scratch' ? null : pv), 0);
      }); return;
    }
    case 'to-trackers': {
      if (d.mode === 'fresh') {
        for (const g of d.goals){ const s1 = parseGoal(g, g.start), t1 = parseGoal(g, g.target);
          if (!String(g.label).trim() || isNaN(s1) || isNaN(t1) || s1 === t1) { ui.err = 'Each goal needs a name, plus a start and target that are different.'; render(); return; } }
        ui.err = ''; ui.view = 'lock'; break;
      }
      for (const g of d.goals){
        const s = parseGoal(g, g.start), t = parseGoal(g, g.target);
        if (!String(g.label).trim() || isNaN(s) || isNaN(t) || s === t) { ui.err = g.kind==='time' ? 'Each goal needs a name, plus start and target times (like 28:00 and 24:59) that are different.' : 'Each goal needs a name, plus a start and target number that are different.'; render(); return; }
      }
      ui.err = ''; ui.view = 'trackers'; break;
    }
    case 'tracker-t': if (d.trackers.length < MAX_TRACKERS) d.trackers.push({...TRACKER_TEMPLATES[v], target:''}); break;
    case 'rm-tracker-d': d.trackers.splice(+v,1); break;
    case 'to-crew': {
      if (d.trackers.some(t => !String(t.label).trim() || (t.target !== '' && isNaN(+t.target)))) { ui.err = 'Each tracker needs a name, and the target needs to be a number.'; break; }
      ui.err = ''; ui.view = 'crew'; break;
    }
    case 'crewmode': if (d.crewMode !== v) { d.crewMode = v; ui.err = ''; } else return; break;
    case 'to-lock': {
      if (d.crewMode === 'join') {
        if (!d.joinCode.trim()) { ui.err = 'Enter the crew code, or pick another option.'; break; }
        busy('Checking…');
        try { const c = await rpc('crew_preview', { p_code: d.joinCode }); d.joinName = c.name; d.joinCode = c.code; d.joinKickoff = c.kickoff; }
        catch(e){ ui.err = errMsg(e); break; }
      } else if (d.crewMode === 'start') {
        if (d.crewName.trim().length < 2) { ui.err = 'Give your crew a name (2–30 characters).'; break; }
      }
      ui.err = ''; ui.view = 'lock'; break;
    }
    case 'start': d.startDate = v; break;
    case 'lock':
      if (d.mode === 'fresh') {
        modal('Lock it in?', "This new list and its goals can't change for 50 days. Your other 50 days keep going as they are.", "I'm in", async () => {
          const ca = d.crewAction;
          try {
            const r = await rpc('create_challenge', { p_token:tok(), p_name: (d.chName || '').trim() || (ca ? ca.name : 'My 50'), p_start: d.startDate,
              p_items: d.items.map((it,i)=>({id:'i'+i, label:it.label, weight:it.weight})),
              p_goals: d.goals.map(g=>({label:String(g.label).trim(), unit: g.kind==='time' ? '' : String(g.unit).trim(), kind:g.kind, start:parseGoal(g,g.start), target:parseGoal(g,g.target), shared:!!g.shared})),
              p_join_code: ca && ca.type==='join' ? ca.code : null, p_new_crew: ca && ca.type==='start' ? ca.name : null, p_for_crew: ca && ca.type==='for' ? ca.crewId : null });
            ui.draft = null; ui.chId = r.challenge_id; ls.set(CHKEY, r.challenge_id);
            if (r.crew_id) { ui.crewId = r.crew_id; ls.set(CREWKEY, r.crew_id); }
            await refresh(); ui.tab = 'today'; render(); scrollTo(0,0);
            toast(ca && ca.type==='start' && r.crew_code ? `Locked in. Invite your crew with ${r.crew_code}` : "Fresh 50 days locked in. Let's go.");
          } catch(e){ toast(errMsg(e)); }
        }); return;
      }
      modal('Lock it in?', "No edits to your list or goals for 50 days. Miss a day and it counts as 0%. You in?", "I'm in", async () => {
        toast('Locking in…');
        try {
          const r = await rpc('create_account', { p_username:d.username, p_pin:d.pin, p_color: COLORS[Math.floor(Math.random()*COLORS.length)], p_photo:d.photo,
            p_start: d.startDate,
            p_items: d.items.map((it,i)=>({id:'i'+i, label:it.label, weight:it.weight})),
            p_goals: d.goals.map(g=>({label:String(g.label).trim(), unit: g.kind==='time' ? '' : String(g.unit).trim(), kind:g.kind, start:parseGoal(g,g.start), target:parseGoal(g,g.target), shared:!!g.shared})),
            p_trackers: d.trackers.map(t=>({label:String(t.label).trim(), unit:String(t.unit).trim(), target: t.target === '' ? '' : +t.target})),
            p_join_code: d.crewMode==='join' ? d.joinCode : null, p_new_crew: d.crewMode==='start' ? d.crewName : null });
          session = { token:r.token }; setSession(session);
          if (r.crew_id) { ui.crewId = r.crew_id; ls.set(CREWKEY, r.crew_id); }
          ui.draft = null; ui.joinPhoto = null; ui.pendingJoin = null;
          await afterLogin(); toast(r.crew_code && d.crewMode==='start' ? `Locked in. Invite your crew with ${r.crew_code}` : "Locked in. Let's go.");
        } catch(e){ toast(errMsg(e)); }
      }); return;
    case 'login': {
      const name = val('l-name'), pin = val('l-pin'); ui.jf.login = name;
      if (!name || !/^\d{4,6}$/.test(pin)) { ui.err = 'Enter your username and PIN.'; break; }
      busy('Logging in…');
      try {
        const r = await rpc('sign_in', { p_username: name, p_pin: pin });
        if (r.error) { ui.err = ERR[r.error] || 'Try again.'; break; }
        session = { token: r.token }; setSession(session); ui.err = '';
        await afterLogin(); return;
      } catch(e){ ui.err = errMsg(e); }
      break;
    }
    /* --- main --- */
    case 'tab':
      ui.tab = v; ui.err = ''; render(); scrollTo(0,0);
      if (v === 'ranks') { try { await loadBoard(); } catch(e){ toast(errMsg(e)); } if (ui.tab === 'ranks') render(); }
      if (v === 'crew') { try { await Promise.all([loadMe(), loadCrew()]); } catch(e){} if (ui.tab === 'crew' && !document.activeElement.closest('input,textarea')) render(); }
      return;
    case 'tick': {
      const ch = CH(), t = today(), arr = ch.days[t] || (ch.days[t] = []), i = arr.indexOf(v);
      i >= 0 ? arr.splice(i,1) : arr.push(v);
      if (CREW && CREW.users[ME.id] && CREW.users[ME.id].challengeId === ch.id) CREW.users[ME.id].days[t] = [...arr];
      const done = [...arr], perfect = score(ch,t) === 100, n = dayNum(ch);
      render();
      if (perfect) toast(`💯 Perfect day. 🔥 ${streak(ch)} day streak`);
      queue(() => rpc('set_day', { p_token:tok(), p_challenge:ch.id, p_day:t, p_done:done, p_perfect:perfect, p_day_num:n })
        .catch(async e => { toast(errMsg(e)); await refresh(); render(); }));
      return;
    }
    case 'log-modal': {
      const g = allGoals().find(x=>x.id===v); if (!g) return;
      const tl = g.logs.find(l=>l.date===today());
      modal(`Log ${esc(g.label)}`, `<label class="mute" style="font-size:13px" for="m-val">${g.kind==='time'?'Your time today (mm:ss)':'Today\'s number'+(g.unit?' ('+esc(g.unit)+')':'')}</label>
        <input class="input" id="m-val" inputmode="${g.kind==='time'?'text':'decimal'}" value="${tl?(g.kind==='time'?fmtTime(tl.value):tl.value):''}" placeholder="${g.kind==='time'?'24:38':''}">
        <p class="tip">Now ${gval(g,cur(g))} · target ${gval(g,g.target)}${bestOf(g)!=null?` · PB ${gval(g,bestOf(g))}`:''}</p>`, 'Save', async (m) => {
        const x = parseGoal(g, m.querySelector('#m-val').value); if (isNaN(x)) { toast(g.kind==='time'?'Enter a time like 24:38':'Enter a number'); return false; }
        await logGoal(g, x);
      }); return;
    }
    case 'log': {
      const g = allGoals().find(x=>x.id===v); const x = parseGoal(g, val('gl-'+v));
      if (isNaN(x)) { toast(g.kind==='time'?'Enter a time like 24:38':'Enter a number'); return; }
      busy(); await logGoal(g, x); break;
    }
    case 'del-log': {
      const [gid, date] = v.split('|');
      try { await rpc('delete_goal_log', { p_token:tok(), p_goal:gid, p_day:date }); await loadMe(); toast('Entry deleted'); } catch(e){ toast(errMsg(e)); }
      break;
    }
    case 'log-tracker': {
      const raw = val('tk-'+v), x = raw === '' ? null : parseFloat(raw.replace(/,/g,''));
      if (raw !== '' && isNaN(x)) { toast('Enter a number'); return; }
      busy();
      try { await rpc('log_tracker', { p_token:tok(), p_tracker:v, p_day:today(), p_value:x }); await loadMe(); toast(x==null?'Cleared':'Saved'); } catch(e){ toast(errMsg(e)); }
      break;
    }
    case 'add-tracker': {
      const tpl = TRACKER_TEMPLATES[v];
      modal('Add a private tracker', `<label class="mute" style="font-size:13px">What</label><input class="input" id="m-l" value="${esc(tpl.label)}" placeholder="e.g. Calories">
        <label class="mute" style="font-size:13px;display:block;margin-top:10px">Unit</label><input class="input" id="m-u" value="${esc(tpl.unit)}" placeholder="kcal">
        <label class="mute" style="font-size:13px;display:block;margin-top:10px">Daily target (optional)</label><input class="input" id="m-t" inputmode="decimal" placeholder="e.g. 2800">`, 'Add', async (m) => {
        const l = m.querySelector('#m-l').value.trim(), u = m.querySelector('#m-u').value.trim(), t = m.querySelector('#m-t').value.trim();
        if (!l) { toast('Give it a name'); return false; } if (t && isNaN(+t)) { toast('Target needs to be a number'); return false; }
        try { await rpc('add_tracker', { p_token:tok(), p_label:l, p_unit:u, p_target: t ? +t : null }); await loadMe(); render(); toast('Tracker added'); } catch(e){ toast(errMsg(e)); }
      }); return;
    }
    case 'rm-tracker':
      modal('Remove tracker?', 'This deletes the tracker and everything you\'ve logged in it.', 'Remove', async () => {
        try { await rpc('remove_tracker', { p_token:tok(), p_tracker:v }); await loadMe(); render(); } catch(e){ toast(errMsg(e)); }
      }); return;
    case 'lb': ui.lb = v; break;
    case 'board': ui.board = v; break;
    case 'switch-crew':
      ui.err = '';
      if (v === '__add') { ui.crewId = '__add'; break; }
      ui.crewId = v; ls.set(CREWKEY, v); CREW = null; render();
      try { await loadCrew(); } catch(e){ toast(errMsg(e)); }
      break;
    case 'goto-crew': ui.tab = 'crew'; scrollTo(0,0); return act('switch-crew', v);
    case 'crewform': ui.crewForm = v; ui.err = ''; break;
    case 'join-crew': {
      const code = val('cf-code'), pv = pickVal(); if (!code) { ui.err = 'Enter the crew code.'; break; }
      busy('Checking…');
      try {
        const c = await rpc('crew_preview', { p_code: code });
        if (ME.crews.some(x => x.code === c.code)) { ui.err = ERR.already_in_crew; break; }
        startFresh({ type:'join', code: c.code, name: c.name, kickoff: c.kickoff }, pv === 'scratch' ? null : pv); return;
      } catch(e){ ui.err = errMsg(e); }
      break;
    }
    case 'create-crew': {
      const name = val('cf-name'), pv = pickVal(); if (name.length < 2) { ui.err = ERR.bad_crew_name; break; }
      startFresh({ type:'start', name }, pv === 'scratch' ? null : pv); return;
    }
    case 'post': {
      const t = val('post-text'); if (!t) return; busy();
      try { await rpc('add_post', { p_token:tok(), p_crew:CREW.id, p_text:t }); await loadCrew(); } catch(e){ toast(errMsg(e)); }
      break;
    }
    case 'like': {
      const p = CREW.feed.find(p=>p.id===v); const i = p.likes.indexOf(ME.id); i>=0 ? p.likes.splice(i,1) : p.likes.push(ME.id); render();
      try { await rpc('toggle_like', { p_token:tok(), p_post:v }); } catch(e){ toast(errMsg(e)); await loadCrew(); }
      break;
    }
    case 'comment': {
      const t = val('c-'+v); if (!t) return; busy();
      try { await rpc('add_comment', { p_token:tok(), p_post:v, p_text:t }); await loadCrew(); } catch(e){ toast(errMsg(e)); }
      break;
    }
    case 'copy-invite': {
      const msg = `Join my Locked In 50 crew "${CREW.name}" 🔒 ${inviteLink(CREW.code)}  (crew code ${CREW.code})`;
      try { await navigator.clipboard.writeText(msg); toast('Invite copied. Paste it to your mates.'); } catch(e){ toast('Crew code: ' + CREW.code); }
      return;
    }
    case 'kickoff': {
      const t = today();
      modal('Change kick-off', `<p style="font-size:14px">Everyone who hasn't started yet moves to the new date.</p><input class="input" type="date" id="m-k" min="${t}" max="${addDays(t,14)}" value="${CREW.kickoff}">`, 'Save', async (m) => {
        const v = m.querySelector('#m-k').value; if (!v) return false;
        try { await rpc('set_kickoff', { p_token:tok(), p_crew:CREW.id, p_date:v }); await refresh(); render(); toast('Kick-off moved to ' + fmtDay(v)); } catch(e){ toast(errMsg(e)); return false; }
      }); return;
    }
    case 'rename-crew':
      modal('Rename crew', `<input class="input" id="m-n" value="${esc(CREW.name)}" maxlength="30">`, 'Save', async (m) => {
        try { await rpc('rename_crew', { p_token:tok(), p_crew:CREW.id, p_name:m.querySelector('#m-n').value }); await refresh(); render(); toast('Crew renamed'); }
        catch(e){ toast(errMsg(e)); return false; }
      }); return;
    case 'new-code':
      modal('Get a new code?', 'The current code and invite link will stop working. Everyone already in the crew stays in.', 'New code', async () => {
        try { const r = await rpc('new_crew_code', { p_token:tok(), p_crew:CREW.id }); await refresh(); render(); toast('New code: ' + r.code); } catch(e){ toast(errMsg(e)); }
      }); return;
    case 'remove-member': {
      const u = CREW.users[v];
      modal(`Remove ${esc(u.name)}?`, `They'll be taken out of ${esc(CREW.name)}. Their own 50 days carry on.`, 'Remove', async () => {
        try { await rpc('remove_member', { p_token:tok(), p_crew:CREW.id, p_account:v }); await refresh(); render(); toast('Removed'); } catch(e){ toast(errMsg(e)); }
      }); return;
    }
    case 'leave-crew': {
      const c = CREW, captain = c.captainId === ME.id, solo = c.members.length === 1;
      modal(`Leave ${esc(c.name)}?`, solo ? 'You\'re the last one in, so the crew will close.' : captain ? 'Captaincy passes to the longest-standing member.' : 'You can rejoin later with the crew code.', 'Leave', async () => {
        try { await rpc('leave_crew', { p_token:tok(), p_crew:c.id }); ui.crewId = null; await refresh(); render(); toast(`Left ${c.name}`); } catch(e){ toast(errMsg(e)); }
      }); return;
    }
    case 'rm-photo':
      try { await rpc('set_photo', { p_token:tok(), p_photo:null }); ME.photo = null; await loadCrew().catch(()=>{}); toast('Photo removed'); } catch(e){ toast(errMsg(e)); }
      break;
    case 'a2hs': showA2hs(); return;
    case 'a2hs-hide': ls.set(A2HS, '1'); toast('You can still add it from the Progress tab'); break;
    case 'logout':
      modal('Log out?', 'You can log back in any time with your username and PIN.', 'Log out', () => {
        session = null; setSession(null); ME = CREW = BOARD = null; ui.view = 'welcome'; ui.tab = 'today'; render(); scrollTo(0,0);
      }); return;
  }
  render();
}
async function logGoal(g, x){
  try {
    const r = await rpc('log_goal', { p_token:tok(), p_goal:g.id, p_day:today(), p_value:x });
    await loadMe(); await loadCrew().catch(()=>{}); render();
    toast(r.pct >= 100 ? '🎯 Goal hit! Massive.' : r.pb ? `🎉 New PB: ${gval(g, x)}` : 'Logged');
  } catch(e){ toast(errMsg(e)); }
}

document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; act(b.dataset.a, b.dataset.v, b); });
document.addEventListener('input', e => {
  const f = e.target.dataset.f, d = ui.draft; if (!d) return;
  if (f && e.target.dataset.g != null) d.goals[+e.target.dataset.g][f] = e.target.type==='checkbox' ? e.target.checked : e.target.value;
  else if (f && e.target.dataset.t != null) d.trackers[+e.target.dataset.t][f] = e.target.value;
  else if (e.target.dataset.d) d[e.target.dataset.d] = e.target.value;
});
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (id === 'start-pick' && ui.draft) { const v = e.target.value, t = today(); if (v && v >= t && v <= addDays(t,14)) ui.draft.startDate = v; render(); return; }
  if (id !== 'photo-in' && id !== 'j-photo') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const url = await toAvatar(f);
    if (id === 'j-photo') { ui.joinPhoto = url; const p = document.getElementById('j-prev'); if (p) p.innerHTML = `<img src="${url}" alt="">`; const t = document.getElementById('j-ptext'); if (t) t.textContent = 'Change photo'; }
    else { await rpc('set_photo', { p_token: tok(), p_photo: url }); ME.photo = url; await loadCrew().catch(()=>{}); render(); toast('Photo updated'); }
  } catch(err) { toast("Couldn't save that image"); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA' || e.target.closest('#modal')) return;
  const id = e.target.id || '';
  if (id === 'add-item') { e.preventDefault(); act('add-item'); }
  else if (id.startsWith('c-')) act('comment', id.slice(2));
  else if (id.startsWith('gl-')) act('log', id.slice(3));
  else if (id.startsWith('tk-')) act('log-tracker', id.slice(3));
  else if (id === 'l-pin' || id === 'l-name') act('login');
  else if (id === 'j-pin') act('account');
  else if (id === 'cf-code') act('join-crew');
  else if (id === 'cf-name') act('create-crew');
});

// Keep things fresh: every 30 seconds, and whenever the app comes back to the front.
async function sync(){
  if (!session || ui.loading || document.hidden || !ME) return;
  const ae = document.activeElement; if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if (document.getElementById('modal').classList.contains('show')) return;
  const y = scrollY; await refresh(); render(); scrollTo(0, y);
}
setInterval(sync, 30000);
document.addEventListener('visibilitychange', sync);

// Invite links: lockedin50.com/?join=CODE
(async function boot(){
  const jc = new URLSearchParams(location.search).get('join');
  if (jc) {
    history.replaceState(null, '', location.pathname);
    ui.pendingJoin = { code: jc.toUpperCase() };
    try { const c = await rpc('crew_preview', { p_code: jc }); ui.pendingJoin = { code: c.code, name: c.name, kickoff: c.kickoff }; }
    catch(e){ ui.pendingJoin = null; toast(e.message === 'bad_code' ? "That invite link has expired. Ask for a new one." : errMsg(e)); }
  }
  render();
  if (session) { await refresh(); render(); if (ui.pendingJoin && ME) offerPendingJoin(); }
})();

</script>
